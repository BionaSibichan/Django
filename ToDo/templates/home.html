{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Productivity</p>
                <h1>To-Do List</h1>
            </div>
            <nav>
                <a href="{% url 'todo:add_task' %}" class="primary-btn">Add Task</a>
            </nav>
        </header>

        <main class="card">
            <div class="section-heading">
                <h2>Task Details</h2>
            </div>

            {% if task %}
                <ol class="task-list">
                    {% for i in task %}
                        <li class="task-item {% if i.completed %}completed{% endif %}">
                            <div class="task-main">
                                <span class="task-name">{{ i.task_name }}</span>
                                {% if i.completed %}
                                    <span class="status-badge">✓ Complete</span>
                                {% endif %}
                            </div>

                            <div class="task-actions">
                                <a href="{% url 'todo:edit_task' i.id %}" class="secondary-btn">Edit</a>
                                <a href="{% url 'todo:delete_task' i.id %}" class="danger-btn" onclick="return confirm('Are you sure you want to delete this task?')">Delete</a>
                            </div>
                        </li>
                    {% endfor %}
                </ol>
            {% else %}
                <p class="empty-state">No tasks yet. Add your first task to get started.</p>
            {% endif %}
        </main>
    </div>
</body>
</html>
