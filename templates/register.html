{% extends "base.html" %}
{% block title %}Sign Up | Student Management{% endblock %}
{% block content %}
<section class="auth-container">
    <p class="eyebrow">GET STARTED</p><h1>Create Account</h1><p class="form-intro">Register to use the student management system.</p>
    <form method="post" action="{% url 'credentials:Sign_Up' %}">
        {% csrf_token %}
        <label for="first_name">First name</label><input id="first_name" type="text" name="first_name" autocomplete="given-name" required>
        <label for="last_name">Last name</label><input id="last_name" type="text" name="last_name" autocomplete="family-name" required>
        <label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>
        <label for="create_password">Create password</label><input id="create_password" type="password" name="create_password" autocomplete="new-password" required>
        <label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required>
        <button type="submit">Create Account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{% url 'credentials:Sign_In' %}">Sign in</a></p>
</section>
{% endblock %}
