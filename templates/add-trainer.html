{% extends "base.html" %}
{% block title %}Add Trainer | Student Management{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">TRAINER MANAGEMENT</p><h1>Add Trainer</h1>
    <p class="form-intro">Fill in the trainer's information.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions"><button type="submit">Save Trainer</button><a class="btn btn-secondary" href="{% url 'student:trainer_list' %}">Cancel</a></div>
    </form>
</section>
{% endblock %}
