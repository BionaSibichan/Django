{% extends "base.html" %}
{% block title %}Sign In | Student Management{% endblock %}
{% block content %}
<section class="auth-container">
    <p class="eyebrow">WELCOME BACK</p><h1>Sign In</h1><p class="form-intro">Sign in to your account.</p>
    <form method="post" action="{% url 'credentials:Sign_In' %}">
        {% csrf_token %}
        <label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>
        <label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'credentials:Sign_Up' %}">Create one</a></p>
</section>
{% endblock %}
